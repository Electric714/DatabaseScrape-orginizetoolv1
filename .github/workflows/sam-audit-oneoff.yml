name: SAM audit one-off patch

on:
  push:
    branches:
      - fix/sam-exclusions-audit-matching

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/sam-exclusions-audit-matching
      - name: Apply audited compatibility and SAM cleanup
        shell: python
        run: |
          from pathlib import Path
          import re

          def replace(path, old, new, count=1):
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              actual = text.count(old)
              if actual != count:
                  raise SystemExit(f"{path}: expected {count} occurrence(s), found {actual}: {old[:100]!r}")
              p.write_text(text.replace(old, new), encoding="utf-8")

          # A prior merge retained typed acquisition code but dropped its imports.
          replace(
              "app/crawler.py",
              "from .errors import SourceAcquisitionError\n",
              "from .errors import SourceAcquisitionError\nfrom .diagnostics import (\n    AcquisitionFailure, AcquisitionStage, AcquisitionStatus, RetryClass,\n    classify_failure,\n)\n",
          )

          # SAM Public V2 is credential-free. Keep an API-key button only for OSHA.
          replace(
              "app/static/app.js",
              "    const builtInKeyButton = isOshaSource(source) ? '<button class=\"settings-button\" type=\"button\" data-dol-key>Set API key</button>' : isSamSource(source) ? '<button class=\"settings-button\" type=\"button\" data-sam-key>Set API key</button>' : '';\n",
              "    const builtInKeyButton = isOshaSource(source) ? '<button class=\"settings-button\" type=\"button\" data-dol-key>Set API key</button>' : '';\n",
          )
          replace(
              "app/static/app.js",
              "    if (button.hasAttribute('data-sam-key')) { openSamKeyDialog(button); return; }\n",
              "",
          )

          # Browser tests must reflect the current no-credential SAM workflow.
          browser = Path("tests/test_browser.py")
          text = browser.read_text(encoding="utf-8")
          patterns = [
              r'^\s*monkeypatch\.setattr\(main, "sam_api_key_configured", lambda: False\)\n',
              r'^\s*expect\(page\.locator\("#samApiKeyButton"\)\)\.to_have_text\("Set SAM API key"\)\n',
              r'^\s*page\.locator\("#samApiKeyButton"\)\.click\(\)\n',
              r'^\s*expect\(page\.locator\("#samKeyDialog"\)\)\.to_be_visible\(\)\n',
              r'^\s*page\.locator\("#samKeyDialog \[data-close=\'samKeyDialog\'\]"\)\.last\.click\(\)\n',
          ]
          counts = []
          for pattern in patterns:
              text, count = re.subn(pattern, "", text, flags=re.M)
              counts.append(count)
          if counts != [1, 1, 1, 1, 1]:
              raise SystemExit(f"tests/test_browser.py stale SAM-key cleanup counts: {counts}")
          old = 'expect(page.get_by_role("button", name="Collect federal debarment", exact=True)).to_be_disabled()'
          if text.count(old) != 1:
              raise SystemExit(f"tests/test_browser.py expected one stale disabled SAM assertion, got {text.count(old)}")
          text = text.replace(old, 'expect(page.get_by_role("button", name="Collect federal debarment", exact=True)).to_be_enabled()', 1)
          browser.write_text(text, encoding="utf-8")

          ui_test = Path("tests/test_frontend_workflow_ui.py")
          text = ui_test.read_text(encoding="utf-8")
          text, count = re.subn(r'^\s*monkeypatch\.setattr\(main, "sam_api_key_configured", lambda: False\)\n', '', text, flags=re.M)
          if count != 1:
              raise SystemExit(f"tests/test_frontend_workflow_ui.py expected one stale SAM-key monkeypatch, got {count}")
          ui_test.write_text(text, encoding="utf-8")

          # Operator instructions still described the retired API-key path.
          start = Path("0 - START HERE.txt")
          text = start.read_text(encoding="utf-8")
          pattern = re.compile(
              r'SAM\.GOV FEDERAL DEBARMENT API KEY\n.*?A clean SAM result does not write N because state debarment is checked separately\.\n',
              re.S,
          )
          replacement = (
              "SAM.GOV FEDERAL DEBARMENT / EXCLUSIONS\n"
              "SAM uses the credential-free daily Exclusions / Public V2 data extract.\n"
              "No SAM API key is required. Click Collect federal debarment after the\n"
              "master CSV is loaded. The app validates and caches the current official\n"
              "CSV/ZIP artifact, then compares only the approved master contractors.\n\n"
              "A confirmed active federal exclusion can propose state_federal_debarment = Y.\n"
              "No match never writes N, and uncertain identity remains manual-review evidence.\n"
          )
          text, count = pattern.subn(replacement, text)
          if count != 1:
              raise SystemExit(f"0 - START HERE.txt expected one obsolete SAM section, got {count}")
          start.write_text(text, encoding="utf-8")

          # README contained both the retired v4 API text and the current Public V2 path.
          readme = Path("README.md")
          text = readme.read_text(encoding="utf-8")
          heading = "## SAM.gov Federal Debarment / Exclusions API — Source 2"
          if text.count(heading) != 1:
              raise SystemExit(f"README.md expected one old SAM heading, got {text.count(heading)}")
          text = text.replace(heading, "## SAM.gov Federal Debarment / Exclusions Public V2 — Source 2", 1)
          old_block = re.compile(
              r'SAM\.gov Federal Debarment is a built-in integration using the official \*\*v4 production Exclusions API\*\* documented by GSA:.*?SAM federal exclusions use the credential-free daily \*\*Exclusions / Public V2\*\* artifact\.',
              re.S,
          )
          new_block = (
              "SAM.gov Federal Debarment is a built-in integration using the official credential-free "
              "daily **Exclusions / Public V2** artifact. The application obtains the current SAM Data "
              "Services artifact once, validates it, caches it, and compares the approved master contractors locally."
          )
          text, count = old_block.subn(new_block, text)
          if count != 1:
              raise SystemExit(f"README.md expected one mixed SAM API/Public V2 block, got {count}")
          text, count2 = re.subn(
              r'\nBecause SAM requires the credential in the query string,.*?outbound network request\.\n',
              "\n",
              text,
              count=1,
              flags=re.S,
          )
          text, count3 = re.subn(
              r'\nThe production endpoint is used for live public exclusion checks\. Exact active federal matches may propose `Y`; absence never clears the combined state/federal field\.\n',
              "\n",
              text,
              count=1,
          )
          if count2 != 1 or count3 != 1:
              raise SystemExit(f"README.md stale credential/endpoint cleanup counts: {count2}/{count3}")
          readme.write_text(text, encoding="utf-8")

      - name: Commit audited cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/crawler.py app/static/app.js tests/test_browser.py tests/test_frontend_workflow_ui.py "0 - START HERE.txt" README.md
          git diff --cached --check
          git commit -m "Complete SAM Public V2 audit cleanup [skip ci]"
          git push origin HEAD:fix/sam-exclusions-audit-matching
