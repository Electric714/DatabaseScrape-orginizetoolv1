name: Patch SAM production labels

on:
  push:
    branches: [fix/sam-production-api]
    paths: [.github/workflows/patch-sam-production-labels.yml]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update production SAM wording
        shell: python
        run: |
          from pathlib import Path

          replacements = {
              "app/main.py": [
                  ('SAM_SOURCE_NAME = "SAM.gov Federal Debarment / Exclusions (Alpha Test API)"', 'SAM_SOURCE_NAME = "SAM.gov Federal Debarment / Exclusions"'),
                  ('Could not reach the SAM.gov Alpha Exclusions API to test this key', 'Could not reach the SAM.gov Exclusions API to test this key'),
                  ('SAM.gov Alpha rejected this API key', 'SAM.gov rejected this API key'),
                  ('SAM.gov Alpha rate limit reached; try the key again after the limit resets', 'SAM.gov rate limit reached; try the key again after the limit resets'),
                  ('SAM.gov Alpha API key test failed with HTTP', 'SAM.gov API key test failed with HTTP'),
                  ('"environment": "alpha"', '"environment": "production"'),
                  ('SAM.gov Alpha Exclusions API key tested and saved', 'SAM.gov production Exclusions API key tested and saved'),
              ],
              "app/static/app.js": [
                  ("'Change SAM test API key' : 'Set SAM test API key'", "'Change SAM API key' : 'Set SAM API key'"),
                  ('Replace and validate the locally saved SAM.gov Alpha API key', 'Replace and validate the locally saved SAM.gov production API key'),
                  ('Enter and validate the SAM.gov Alpha/test API key required for federal debarment collection', 'Enter and validate the SAM.gov production API key required for federal debarment collection'),
                  ('SAM.gov Alpha API key test failed: ', 'SAM.gov API key test failed: '),
              ],
              "app/static/index.html": [
                  ('Set SAM test API key', 'Set SAM API key'),
                  ('Set the SAM.gov test API key.', 'Set the SAM.gov API key.'),
                  ('Federal debarment is hardcoded to the official SAM.gov Exclusions API v4 Alpha/test endpoint. Paste the Alpha API key here; the app will test it before saving it locally.', 'Federal debarment uses the official SAM.gov Exclusions API v4 production endpoint. Paste your SAM.gov Public API Key here; the app will test it before saving it locally.'),
              ],
              "tests/test_browser.py": [
                  ('to_have_text("Set SAM test API key")', 'to_have_text("Set SAM API key")'),
              ],
              "0 - START HERE.txt": [
                  ('SAM.GOV FEDERAL DEBARMENT TEST API KEY', 'SAM.GOV FEDERAL DEBARMENT API KEY'),
                  ('Federal debarment uses the official SAM.gov Exclusions API v4 Alpha/test endpoint:\nhttps://api-alpha.sam.gov/entity-information/v4/exclusions', 'Federal debarment uses the official SAM.gov Exclusions API v4 production endpoint:\nhttps://api.sam.gov/entity-information/v4/exclusions'),
                  ('Click Set SAM test API key, paste the Alpha/test API key, then choose', 'Click Set SAM API key, paste your SAM.gov Public API Key, then choose'),
              ],
              "README.md": [
                  ('SAM.gov Federal Debarment is also a built-in integration. For the current proof-of-concept the application is pinned to the official **v4 Alpha/test Exclusions API** documented by GSA:', 'SAM.gov Federal Debarment is a built-in integration using the official **v4 production Exclusions API** documented by GSA:'),
                  ('- Alpha/test endpoint: `https://api-alpha.sam.gov/entity-information/v4/exclusions`\n- Production endpoint reserved for promotion later: `https://api.sam.gov/entity-information/v4/exclusions`', '- Production endpoint: `https://api.sam.gov/entity-information/v4/exclusions`\n- Alpha endpoint remains documented by GSA for pre-production testing: `https://api-alpha.sam.gov/entity-information/v4/exclusions`'),
                  ('The built-in SAM card has a **Set SAM test API key** control; the app validates the key against the official Alpha endpoint before saving it to `.runtime/sam_api_key.txt`.', 'The built-in SAM card has a **Set SAM API key** control; the app validates the key against the official production endpoint before saving it to `.runtime/sam_api_key.txt`.'),
                  ('The Alpha endpoint is for testing. GSA documents separate Alpha access/account steps and rate limits; production promotion should happen only after the adapter has been validated with the law firm\'s examples.', 'The production endpoint is used for live public exclusion checks. Exact active federal matches may propose `Y`; absence never clears the combined state/federal field.'),
              ],
          }

          for name, pairs in replacements.items():
              path = Path(name)
              text = path.read_text(encoding="utf-8")
              for old, new in pairs:
                  if old not in text:
                      raise SystemExit(f"expected text missing in {name}: {old[:80]!r}")
                  text = text.replace(old, new)
              path.write_text(text, encoding="utf-8")
      - name: Commit wording fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/main.py app/static/app.js app/static/index.html tests/test_browser.py "0 - START HERE.txt" README.md
          git commit -m "Update SAM integration to production endpoint"
          git push
