name: Apply stale CI assertion fixes

on:
  push:
    branches:
      - fix/api-key-validation
    paths:
      - .github/workflows/apply-stale-ci-fix.yml
      - scripts/fix_stale_ci_assertions.py

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply stale-test cleanup
        run: python scripts/fix_stale_ci_assertions.py
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run affected tests
        env:
          RUN_BROWSER_TESTS: "0"
        run: pytest -q tests/test_live_source_regressions.py tests/test_api_key_validation.py tests/test_sam_integration.py
      - name: Commit test cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/test_browser.py tests/test_live_source_regressions.py
          git commit -m "Refresh API and BBB regression assertions"
          git pull --rebase origin fix/api-key-validation
          git push origin HEAD:fix/api-key-validation
