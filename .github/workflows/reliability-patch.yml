name: Apply reliability hardening patch

on:
  push:
    branches:
      - hardening/reliability-recovery-audit

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fix patch runner alias
        run: python scripts/fix_reliability_patch.py
      - name: Apply hardening edits
        run: python scripts/apply_reliability_hardening.py
      - name: Commit hardening
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Harden scan recovery persistence and backups'
          git push origin HEAD:${GITHUB_REF_NAME}
