name: Prune stale branches

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/prune-stale-branches.yml

permissions:
  contents: write

jobs:
  prune:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Delete stale remote branches
        shell: bash
        run: |
          set -euo pipefail
          stale=(
            bidder-database-schema
            csv-baseline-comparison
            feature/builtin-bbb-complaints-parser
            feature/builtin-osha-api-key
            feature/builtin-sam-exclusions-alpha
            fix/api-key-validation
            fix/bbb-sitemap-discovery
            fix/dol-auth-bbb-diagnostics
            fix/osha-dol-rest-api
            fix/osha-key-button-visibility
            fix/sam-production-api
            fix-bidder-table-and-master-upload
            osha-browser-session-fetch
            osha-disable-robots-poc
            osha-proof-of-concept
            osha-visible-browser-poc
            paralegal-database-tool-branding
            poc/state-debarment-wi-il
            poc/targeted-research-validation
            ui/research-desk-workspaces
          )
          for branch in "${stale[@]}"; do
            if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
              echo "Deleting $branch"
              git push origin --delete "$branch"
            else
              echo "Already absent: $branch"
            fi
          done

      - name: Remove temporary pruning workflow
        shell: bash
        run: |
          rm .github/workflows/prune-stale-branches.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/prune-stale-branches.yml
          git commit -m "Remove temporary branch-pruning workflow"
          git push origin HEAD:main
