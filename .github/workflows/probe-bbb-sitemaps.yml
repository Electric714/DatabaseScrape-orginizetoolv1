name: Probe BBB published sitemap structure

on:
  push:
    branches: [fix/bbb-sitemap-discovery]
    paths: [.github/workflows/probe-bbb-sitemaps.yml]

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect published BBB sitemap structure
        shell: python
        run: |
          import re
          import urllib.request
          import xml.etree.ElementTree as ET
          from collections import Counter
          from pathlib import Path
          from urllib.parse import urlsplit

          UA = "DatabaseScrapeOrganizer/0.1 (+public-sitemap-validation)"
          lines = []
          def note(*parts):
              line = " ".join(str(p) for p in parts)
              print(line)
              lines.append(line)
          def fetch(url):
              req = urllib.request.Request(url, headers={"User-Agent": UA, "Accept": "application/xml,text/xml;q=0.9,*/*;q=0.1"})
              with urllib.request.urlopen(req, timeout=30) as r:
                  body = r.read()
                  note("FETCH", url, r.status, r.headers.get("content-type"), len(body))
                  return body

          index_url = "https://www.bbb.org/sitemap-business-profiles-index.xml"
          root = ET.fromstring(fetch(index_url))
          locs = [el.text.strip() for el in root.iter() if el.tag.endswith("loc") and el.text]
          note("INDEX_COUNT", len(locs))
          note("INDEX_FIRST", locs[:10])
          note("INDEX_LAST", locs[-5:])

          for child in locs[:3]:
              child_root = ET.fromstring(fetch(child))
              urls = [el.text.strip() for el in child_root.iter() if el.tag.endswith("loc") and el.text]
              note("CHILD", child, "URL_COUNT", len(urls))
              states = Counter()
              shape = Counter()
              for u in urls:
                  parts = urlsplit(u)
                  seg = [x for x in parts.path.split('/') if x]
                  if len(seg) >= 2 and seg[0] in {"us", "ca"}:
                      states[seg[1]] += 1
                  if "/profile/" in parts.path:
                      sanitized = re.sub(r"(/profile/[^/]+/)[^/?#]+", r"\1<business-slug>", parts.path)
                      shape[sanitized] += 1
              note("STATE_COUNTS", states.most_common(10))
              note("PATH_SHAPES", shape.most_common(5))

          Path(".probe").mkdir(exist_ok=True)
          Path(".probe/bbb_sitemap_summary.txt").write_text("\n".join(lines) + "\n", encoding="utf-8")
      - name: Commit probe summary
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .probe/bbb_sitemap_summary.txt
          git commit -m "Record BBB sitemap probe summary"
          git push origin HEAD:fix/bbb-sitemap-discovery
