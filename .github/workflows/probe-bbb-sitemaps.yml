name: Apply BBB sitemap wiring

on:
  push:
    branches:
      - fix/bbb-sitemap-discovery
    paths:
      - .github/workflows/probe-bbb-sitemaps.yml
      - scripts/apply_bbb_sitemap_wiring.py

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply wiring
        run: python scripts/apply_bbb_sitemap_wiring.py
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run focused BBB tests
        run: pytest -q tests/test_bbb_sitemap_adapter.py tests/test_bbb_integration.py
      - name: Commit production wiring
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/main.py app/crawler.py README.md tests/test_bbb_integration.py
          git commit -m "Use local Chromium for discovered BBB profiles"
          git pull --rebase origin fix/bbb-sitemap-discovery
          git push origin HEAD:fix/bbb-sitemap-discovery
