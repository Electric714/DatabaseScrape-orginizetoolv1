name: Probe BBB published sitemap structure

on:
  push:
    branches: [fix/bbb-sitemap-discovery]
    paths: [.github/workflows/probe-bbb-sitemaps.yml]

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Map BBB sitemap state ranges
        shell: python
        run: |
          import concurrent.futures
          import re
          import urllib.request
          import xml.etree.ElementTree as ET
          from collections import Counter, defaultdict
          from pathlib import Path

          UA = "DatabaseScrapeOrganizer/0.1 (+public-sitemap-validation)"
          TARGETS = {"wi", "il", "mn", "oh", "mo", "fl"}
          INDEX = "https://www.bbb.org/sitemap-business-profiles-index.xml"
          STATE_RE = re.compile(rb"https://www\.bbb\.org/us/([a-z]{2})/[^<\s]+/profile/", re.I)

          def request(url, headers=None):
              merged = {
                  "User-Agent": UA,
                  "Accept": "application/xml,text/xml;q=0.9,*/*;q=0.1",
                  "Accept-Encoding": "identity",
              }
              merged.update(headers or {})
              req = urllib.request.Request(url, headers=merged)
              with urllib.request.urlopen(req, timeout=30) as r:
                  return r.status, dict(r.headers), r.read()

          status, headers, body = request(INDEX)
          root = ET.fromstring(body)
          locs = [el.text.strip() for el in root.iter() if el.tag.endswith("loc") and el.text]

          def sample(item):
              idx, url = item
              try:
                  status, headers, body = request(url, {"Range": "bytes=0-65535"})
                  counts = Counter(x.decode("ascii").lower() for x in STATE_RE.findall(body))
                  dominant = counts.most_common(1)[0][0] if counts else "??"
                  return idx, status, len(body), dominant, counts
              except Exception as exc:
                  return idx, 0, 0, "ERR", Counter()

          sampled = {}
          with concurrent.futures.ThreadPoolExecutor(max_workers=8) as pool:
              for result in pool.map(sample, enumerate(locs, start=1)):
                  sampled[result[0]] = result

          dominant_ranges = []
          start = 1
          current = sampled[1][3]
          for idx in range(2, len(locs) + 2):
              state = sampled[idx][3] if idx <= len(locs) else None
              if state != current:
                  dominant_ranges.append((start, idx - 1, current))
                  start = idx
                  current = state

          target_hits = defaultdict(list)
          for idx, (_, status, size, dominant, counts) in sampled.items():
              for state in TARGETS:
                  if counts[state]:
                      target_hits[state].append(idx)

          lines = [
              f"INDEX_STATUS {status}",
              f"INDEX_COUNT {len(locs)}",
              "PARTIAL_BYTES 65536",
              f"SAMPLED_OK {sum(1 for _,s,_,_,_ in sampled.values() if s == 206)}",
              "DOMINANT_RANGES " + repr(dominant_ranges),
          ]
          for state in sorted(TARGETS):
              hits = target_hits[state]
              lines.append(f"TARGET {state} SAMPLE_HITS {hits}")
              if hits:
                  lines.append(f"TARGET {state} MINMAX {min(hits)} {max(hits)}")

          Path(".probe").mkdir(exist_ok=True)
          Path(".probe/bbb_sitemap_summary.txt").write_text("\n".join(lines) + "\n", encoding="utf-8")
          print("\n".join(lines))
      - name: Commit probe summary
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .probe/bbb_sitemap_summary.txt
          git commit -m "Record BBB sitemap state-range probe"
          git push origin HEAD:fix/bbb-sitemap-discovery
