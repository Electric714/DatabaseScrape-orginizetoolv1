name: Apply BBB runtime hardening

on:
  push:
    branches:
      - fix/bbb-resilient-collection
    paths:
      - scripts/apply_bbb_runtime_hardening.py
      - .github/workflows/apply-bbb-runtime-hardening.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/bbb-resilient-collection
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply patch
        run: python scripts/apply_bbb_runtime_hardening.py
      - name: Verify focused tests
        run: |
          python -m pip install -r requirements.txt
          pytest -q tests/test_bbb_sitemap_adapter.py tests/test_access_challenge_detection.py
      - name: Commit production patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/main.py app/crawler.py
          if git diff --cached --quiet; then
            echo "No production changes to commit"
          else
            git commit -m "Harden BBB runtime collection"
            git push origin HEAD:fix/bbb-resilient-collection
          fi
