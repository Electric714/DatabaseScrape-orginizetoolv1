name: Apply BBB and VT production hardening
# staging-retry: 3

on:
  push:
    branches:
      - fix/bbb-vt-production-hardening
    paths:
      - '.hardening/**'
      - .github/workflows/apply-bbb-vt-production-hardening.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/bbb-vt-production-hardening
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply production hardening payloads
        shell: bash
        run: |
          set -euo pipefail
          gzip -dc .hardening/bbb_sitemap_adapter.py.gz > app/bbb_sitemap_adapter.py
          gzip -dc .hardening/violation_tracker_adapter.py.gz > app/violation_tracker_adapter.py
          gzip -dc .hardening/test_bbb_production_hardening.py.gz > tests/test_bbb_production_hardening.py
          gzip -dc .hardening/test_violation_tracker_adapter.py.gz > tests/test_violation_tracker_adapter.py
          gzip -dc .hardening/test_access_challenge_detection.py.gz > tests/test_access_challenge_detection.py
          gzip -dc .hardening/apply_bbb_vt_runtime_hardening.py.gz > /tmp/apply_bbb_vt_runtime_hardening.py
          python /tmp/apply_bbb_vt_runtime_hardening.py
      - name: Install test dependencies
        run: python -m pip install -r requirements.txt
      - name: Run focused regression suite
        run: >-
          pytest -q
          tests/test_violation_tracker_adapter.py
          tests/test_bbb_production_hardening.py
          tests/test_access_challenge_detection.py
          tests/test_bbb_sitemap_adapter.py
          tests/test_bbb_integration.py
          tests/test_poc_safety.py
      - name: Commit production changes and remove temporary staging files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/bbb_sitemap_adapter.py app/violation_tracker_adapter.py app/crawler.py app/main.py app/source_catalog.py
          git add tests/test_bbb_production_hardening.py tests/test_violation_tracker_adapter.py tests/test_access_challenge_detection.py
          git rm -r .hardening .github/workflows/apply-bbb-vt-production-hardening.yml
          git commit -m "Harden BBB and Violation Tracker integrations"
          git push origin HEAD:fix/bbb-vt-production-hardening
