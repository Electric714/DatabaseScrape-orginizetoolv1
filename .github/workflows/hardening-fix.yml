name: Apply hardening output fixes

on:
  push:
    branches:
      - hardening/reliability-recovery-audit

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply output fixes
        run: python scripts/fix_hardening_round2.py
      - name: Commit fixes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Fix atomic migration and generated hardening files'
          git push origin HEAD:${GITHUB_REF_NAME}
