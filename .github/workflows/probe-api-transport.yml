name: Apply API key validation fixes

on:
  push:
    branches:
      - fix/api-key-validation
    paths:
      - .github/workflows/probe-api-transport.yml
      - scripts/apply_api_key_validation_fix.py
      - tests/test_api_key_validation.py

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply validator patch
        run: python scripts/apply_api_key_validation_fix.py
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run focused API integration tests
        run: pytest -q tests/test_api_key_validation.py tests/test_sam_integration.py
      - name: Commit production changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/main.py app/static/app.js
          git commit -m "Fix DOL and SAM API key validation"
          git pull --rebase origin fix/api-key-validation
          git push origin HEAD:fix/api-key-validation
