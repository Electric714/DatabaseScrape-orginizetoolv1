name: Probe BBB direct profile access

on:
  push:
    branches:
      - fix/bbb-sitemap-discovery
    paths:
      - .github/workflows/apply-bbb-sitemap.yml
      - scripts/probe_bbb_live_access.py

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium
      - name: Probe sitemap to profile to complaints
        env:
          PYTHONPATH: .
        run: python scripts/probe_bbb_live_access.py
      - name: Show sanitized result
        run: cat .probe/bbb_live_access_summary.txt
